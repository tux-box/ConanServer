
services:
  conanexiles:
    build: .
    container_name: conanexiles
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27015:27015/udp"
    volumes:
      - C:\D_CS:/conanexiles
    environment:
      - MAXPLAYERS=40
      - SESSIONNAME=My Docker Conan Exiles Server
      - ADMINPASSWORD=admin123
